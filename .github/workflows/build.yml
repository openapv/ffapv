name: Build FFmpeg

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            build-essential \
            cmake \
            git-core \
            libass-dev \
            libfreetype6-dev \
            libgnutls28-dev \
            libmp3lame-dev \
            libsdl2-dev \
            libtool \
            libva-dev \
            libvdpau-dev \
            libvorbis-dev \
            libxcb1-dev \
            libxcb-shm0-dev \
            libxcb-xfixes0-dev \
            meson \
            ninja-build \
            pkg-config \
            texinfo \
            wget \
            nasm \
            zlib1g-dev

      - name: Build and install openAPV dependency
        run: |
          git clone --depth 1 https://github.com/AcademySoftwareFoundation/openapv.git
          cmake -S openapv -B openapv/build -DCMAKE_BUILD_TYPE=Release
          cmake --build openapv/build -j$(nproc)
          sudo cmake --install openapv/build
          sudo ldconfig

      - name: Build FFmpeg
        run: |         
          ./configure --extra-libs="-lpthread -lm" --enable-ffplay --enable-liboapv
          make -j$(nproc)
          sudo make install

      - name: Verify run
        run: |
          oapv_app_enc
          ffmpeg -version
          
