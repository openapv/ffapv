name: Build FFmpeg

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            build-essential \
            cmake \
            git-core \
            libass-dev \
            libfreetype6-dev \
            libgnutls28-dev \
            libmp3lame-dev \
            libsdl2-dev \
            libtool \
            libva-dev \
            libvdpau-dev \
            libvorbis-dev \
            libxcb1-dev \
            libxcb-shm0-dev \
            libxcb-xfixes0-dev \
            meson \
            ninja-build \
            pkg-config \
            texinfo \
            wget \
            nasm \
            zlib1g-dev

          sudo apt-get install -y jq

      - name: Fetch and install openAPV dependency
        run: |
          LATEST_RELEASE=$(curl -s https://api.github.com/repos/AcademySoftwareFoundation/openapv/releases/latest)
          DEPENDENCY_URL=$(echo $LATEST_RELEASE | jq -r '.assets[] | select(.name | endswith("amd64.deb")) | .browser_download_url + " " + .name' | sort -V | tail -n 1 | awk '{print $1}')
          wget $DEPENDENCY_URL -O openapv.deb
          sudo dpkg -i openapv.deb
          sudo apt-get install -f

      - name: Build FFmpeg
        run: |         
          ./configure --extra-libs="-lpthread -lm" --enable-ffplay --enable-liboapv
          make -j$(nproc)
          sudo make install

      - name: Verify run
        run: |
          oapv_app_enc
          ffmpeg -version

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
            install: >-
              git
              mingw-w64-x86_64-toolchain
              make
              yasm
              unzip
              pkg-config
              tar
              curl
              jq
            update: true
            msystem: MINGW64


      # - name: Install build dependencies
      #   run: |
      #     sudo apt-get update
      #     sudo apt-get install -y \
      #       autoconf \
      #       automake \
      #       build-essential \
      #       cmake \
      #       git-core \
      #       libass-dev \
      #       libfreetype6-dev \
      #       libgnutls28-dev \
      #       libmp3lame-dev \
      #       libsdl2-dev \
      #       libtool \
      #       libva-dev \
      #       libvdpau-dev \
      #       libvorbis-dev \
      #       libxcb1-dev \
      #       libxcb-shm0-dev \
      #       libxcb-xfixes0-dev \
      #       meson \
      #       ninja-build \
      #       pkg-config \
      #       texinfo \
      #       wget \
      #       nasm \
      #       zlib1g-dev
      #     sudo apt-get install -y jq \
      #       mingw-w64

      - name: Fetch and install openAPV dependency
        shell: msys2 {0}
        run: |
          LATEST_RELEASE=$(curl -s https://api.github.com/repos/AcademySoftwareFoundation/openapv/releases/latest)
          DEPENDENCY_URL=$(echo $LATEST_RELEASE | jq -r '.assets[] | select(.name | endswith("win64.zip")) | .browser_download_url + " " + .name' | sort -V | tail -n 1 | awk '{print $1}')
          wget $DEPENDENCY_URL -O openapv.zip
          unzip openapv.zip -d dep

          APV_DIR=$(find dep -mindepth 1 -maxdepth 2 -type d -name "OpenAPV*")
          echo "PKG_CONFIG_PATH=$APV_DIR/lib/pkgconfig" >> $GITHUB_ENV
          echo "CFLAGS=I$APV_DIR/include" >> $GITHUB_ENV
          echo "LDFLAGS=L$APV_DIR/lib" >> $GITHUB_ENV
          echo "PATH=L$APV_DIR/bin:$PATH" >> $GITHUB_ENV

      - name: Show FFmpeg config inputs
        run: |
          echo "CFLAGS=$CFLAGS"
          echo "LDLAGS=$LDLAGS"
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH"

      - name: Build FFmpeg
        shell: msys2 {0}
        run: |
          ./configure \
          --prefix="$PWD/build" --pkg-config-flags="--static" \
          --extra-cflags="$CFLAGS" \ 
          --extra-ldflags="$LDFLAGS" \
          --target-os=mingw32 --arch=x86_64 --toolchain=msvc \
          --enable-sdl2 --enable-gpl --enable-ffplay --enable-liboapv \

          make -j$(nproc)
          make install

